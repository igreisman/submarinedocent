name: Weekly What's New entry

# Friday 09:00 UTC. That is 02:00 Pacific while daylight saving is in force and
# 01:00 Pacific in winter: GitHub's scheduler has no timezone, so one of the two
# has to drift by an hour. The script decides which week a commit belongs to
# using America/Los_Angeles either way, so the entry's boundaries are correct
# even when the job itself runs an hour early.
on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:
    inputs:
      since:
        description: 'Rebuild a specific week: start, e.g. 2026-09-18T02:00'
        required: false
      until:
        description: 'Rebuild a specific week: end, e.g. 2026-09-25T02:00'
        required: false

permissions:
  contents: write

jobs:
  entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The generator reads the week's commits and counts records at both
          # ends of the window, so it needs real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the entry
        run: |
          if [ -n "${{ inputs.since }}" ] && [ -n "${{ inputs.until }}" ]; then
            python3 scripts/whats_new.py --since "${{ inputs.since }}" --until "${{ inputs.until }}"
          else
            python3 scripts/whats_new.py
          fi

      - name: Commit if the week produced anything
        run: |
          # The admin changelog gains an entry every week, including a week in
          # which nothing a visitor can see changed. The public page may not.
          if git diff --quiet -- web/whats-new.json web/whats-new-all.json; then
            echo "no commits at all this week; nothing to record"
            exit 0
          fi
          git config user.name  "submarinedocent-bot"
          git config user.email "noreply@submarinedocent.org"
          WEEK=$(python3 -c "import json;print(json.load(open('web/whats-new-all.json'))['entries'][0]['week_ending'])")
          git add web/whats-new.json web/whats-new-all.json
          git commit -m "What's New: week ending ${WEEK}"
          git push
