<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send a Question or Suggestion — SubmarineDocent</title>
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    body {
      background: #0a0f1a;
      color: #e8e8e8;
      min-height: 100dvh;
    }

    .contact-card {
      background: #0d1525;
      border: 1px solid #1e2d4a;
      border-radius: 14px;
    }

    .form-control {
      background: #0a0f1a;
      border: 1px solid #2a3a5a;
      color: #e8e8e8;
    }

    .form-control:focus {
      background: #0a0f1a;
      border-color: #4a7bc8;
      color: #e8e8e8;
      box-shadow: 0 0 0 0.2rem rgba(74, 123, 200, 0.25);
    }

    .form-text {
      color: #8a97ad;
    }

    a {
      color: #7fb0f0;
    }
  </style>
</head>

<body>
  <div class="container py-5" style="max-width: 640px;">
    <p class="mb-3"><a href="/web/welcome.html">&larr; Back to welcome</a></p>

    <div class="contact-card p-4 p-md-5">
      <h1 class="h3 mb-2">Send a question or suggestion</h1>
      <p class="text-secondary mb-4">
        Spotted an error, have a question, or an idea to make the tour better?
        Let us know. Name and email are optional &mdash; include an email only if you'd like a reply.
      </p>

      <form id="contactForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Name <span class="form-text">(optional)</span></label>
          <input type="text" class="form-control" id="name" name="name" autocomplete="name" maxlength="120">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email <span class="form-text">(optional, for a reply)</span></label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" maxlength="200">
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" name="message" rows="6" maxlength="4000" required></textarea>
          <div class="form-text">Required.</div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Send</button>
        <span id="status" class="ms-3" role="status" aria-live="polite"></span>
      </form>
    </div>
  </div>

  <script>
    // ── API base (match pampanito settings or default to same origin) ──────────
    function getApiBase() {
      try {
        const s = JSON.parse(localStorage.getItem('docentSettings') || '{}');
        return (s.apiBase || '').replace(/\/+$/, '') || window.location.origin;
      } catch (_) { return window.location.origin; }
    }

    const form = document.getElementById('contactForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = document.getElementById('message').value.trim();
      if (!message) {
        statusEl.textContent = 'Please enter a message.';
        statusEl.className = 'ms-3 text-warning';
        document.getElementById('message').focus();
        return;
      }

      const payload = {
        source: 'contact',
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        message,
      };

      submitBtn.disabled = true;
      statusEl.textContent = 'Sending…';
      statusEl.className = 'ms-3 text-secondary';

      try {
        const res = await fetch(`${getApiBase()}/feedback`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        form.reset();
        statusEl.textContent = 'Thank you! Your message was sent.';
        statusEl.className = 'ms-3 text-success';
      } catch (err) {
        statusEl.textContent = `Sorry, something went wrong (${err.message}). Please try again.`;
        statusEl.className = 'ms-3 text-warning';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
